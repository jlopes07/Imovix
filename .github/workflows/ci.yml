name: CI - Imovix Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25 + ArchUnit + Spotless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Java 25 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Permissao de Execucao no Maven Wrapper
        run: chmod +x mvnw

      - name: Validar Formatacao (Spotless Check)
        run: ./mvnw spotless:check

      - name: Executar Testes Unitarios e Arquiteturais (ArchUnit)
        run: ./mvnw test

  frontend:
    name: Frontend (React 19 + TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Executar Linter (Oxlint / ESLint)
        run: npm run lint

      - name: Compilar Bundle de Producao (TypeScript + Vite)
        run: npm run build
